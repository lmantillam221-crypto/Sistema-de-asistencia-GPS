# Nube.chic · Asistencia en Netlify
# - Sitio: app del equipo (/) y panel (/panel)
# - API: función "api" con la base de datos en Netlify Blobs (no requiere servicios externos)

[build]
  command = "npm run build:netlify"
  publish = "dist/netlify/sitio"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "dist/netlify/funciones"
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/panel"
  to = "/panel.html"
  status = 200

[[redirects]]
  from = "/panel/*"
  to = "/panel.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(self), camera=(), microphone=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://*.tile.openstreetmap.org; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache"
